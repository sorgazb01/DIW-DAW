<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="hover-button">Enviar</button>
    <style>
      .hover-button {
        padding: 0.5em 1em;
        background-color: black;
        color: white;
        border: 2px solid black;
        cursor: pointer;
        font-size: 4rem;
        
      }

      .hover-button:hover{
        animation: animacionBotonTam 2s, 
        animacionBotonFondo 2s infinite;
        animation-fill-mode: forwards;
      }

      @keyframes animacionBotonTam {
        10%{
            font-size: 6rem;
        }100%{
            font-size: 6rem;
        }
      }

      @keyframes animacionBotonFondo{
        55%{
            background-color: white;
            color: black;
        }100%{
            background-color: black;
            color: white;
        }
      }
    </style>
  </body>
</html>

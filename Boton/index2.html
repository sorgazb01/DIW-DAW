    <style>
        .caja{
            width: 100px;
            height: 100px;
            background-color: red;
            animation: animacionTam 3s  infinite;
        }
        @keyframes animacionTam {
          33%{
            width: 200px;
            height: 100px; 
         }66%{
            width: 200px;
            height: 200pX;
          }
          78.5%{
            width: 100px;
            height: 200px;
          }100%{
            height: 100px;
            width: 100px;
          }
        }
    </style>
</body>

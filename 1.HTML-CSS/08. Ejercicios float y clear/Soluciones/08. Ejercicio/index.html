<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .clearfix::after{
            content: "";
            clear: both;
            display: table;
        }

        footer{
            background-color: grey;
            padding: 10px;
        }

        .modulo{
            float: left;
        }

        .profesor{
            float: right;
        }

        .contenedor div{
            float: left;
            width: 33.33%;
            padding: 5px;
            text-align: center;
        }

        .contenedor div img{
            width: 100%;
        }

        .contenedor{
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="contenedor clearfix">
        <div>
            <img src="14-400x200.jpg" alt="" >
            <p>Hola</p>
        </div>
        <div>
            <img src="16-400x200.jpg" alt="">
            <p>Hola</p>
        </div>
        <div>
            <img src="17-400x200.jpg" alt="">
            <p>Hola</p>
        </div>
    </div>
    <footer class="clearfix">
        <p class="modulo">2ºDAW. Diseño de interfaces Web</p>
        <p class="profesor">Isaac</p>
    </footer>
</body>
</html>

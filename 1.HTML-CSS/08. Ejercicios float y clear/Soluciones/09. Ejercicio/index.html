<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }

        .clearfix::after{
            content: "";
            clear: both;
            display: table;
        }

        header{
            background-color: black;
        }

        header div{
            float: left;
            padding: 15px;
        }

        header div a{
            color: white;
        }

        .dr{
            float: right;
        }

        header div:hover{
            background-color: red;
        }

    </style>
</head>
<body>
    <header class="clearfix">
        <div class="pr">
            <a href="">Inicio</a>
        </div>
        <div>
            <a href="">Nosotros</a>
        </div>
        <div>
            <a href="">Productos</a>
        </div>
        <div>
            <a href="">Contacto</a>
        </div>
        <div class="dr">
            <a href="">Salir</a>
        </div>
    </header>
</body>
</html>

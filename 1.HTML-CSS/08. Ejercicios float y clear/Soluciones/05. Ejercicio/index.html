<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .clearfix::after {
        content: "";
        clear: both;
        display: table;
      }
      .div1 {
        background-color: aqua;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        width: 25%;
        text-align: center;
        font-weight: bold;
      }
      .div2 {
        background-color: antiquewhite;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        width: 25%;
        text-align: center;
        font-weight: bold;
      }
      .div3 {
        background-color: orange;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        width: 25%;
        text-align: center;
        font-weight: bold;
      }
      .div4 {
        background-color: cadetblue;
        float: left;
        padding: 20px;
        box-sizing: border-box;
        width: 25%;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="clearfix">
      <div class="div1">Div1</div>
      <div class="div2">Div2</div>
      <div class="div3">Div3</div>
      <div class="div4">Div4</div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicios float y clear. Ej. 5</title>
  <link rel="stylesheet" href="../../../Utils/css/general.css">

  <style>
    * {
      box-sizing: border-box;
    }

    .flotante {
      justify-content: stretch;
      width: 25%;
      padding: 20px;
      text-align: center;
      font-weight: bold;
    }

    .flotante.div1 {
      background-color: aqua;
    }

    .flotante.div2 {
      background-color: beige;
    }

    .flotante.div3 {
      background-color: coral;
    }

    .flotante.div4 {
      background-color: cornflowerblue;
    }

    .padre{
      display: flex;
    }
  </style>


</head>

<body>
  <div class="padre">
    <div class="flotante div1">Div1</div>
    <div class="flotante div2">Div2</div>
    <div class="flotante div3">Div3</div>
    <div class="flotante div4">Div4</div>
  </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.5</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
</head>
<body>
    <button id="my-button">Botón</button>
    <input type="text" id="my-input" disabled>
    
    <script>
        // A partir del siguiente HTML, crea el código jQuery que haga que al pulsar el botón se habilite el input.
        $(document).ready(function () {
            $('#my-button').on('click',function(){
                $('#my-input').removeAttr('disabled')
            })
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.12</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
</head>
<body>
    <form id="form-login">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username">
        <br>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password">
        <br>
        <button type="submit">Iniciar sesión</button>
    </form>

    <script>
        // Dado el siguiente formulario de login, los datos de usuario y contraseña 
        // se enviarán por GET asíncronamente con $.ajax a una página llamada login.json. 
        // Esa página devolverá simplemente un JSON con los parámetros error y error_msj. 
        // Si el parámetro error recibido es 0, inserta dinámicamente un mensaje debajo del 
        // formulario indicando que el inicio de sesión ha sido correcto. 
        // Si es distinto de 0 el mensaje debe ser el que se haya recibido en error_msj. 
        // Diseña el código jQuery que haga esa llamada asíncrona.

        $(document).ready(function () {
            $('button').on('click',function(e){
                e.preventDefault()
                $.ajax({
                    method:'GET',
                    url:'login.json',
                    dataType: "json",
                    data: {
                        username: $('#username').val(),
                        password: $('#password').val()
                    },
                    success:function(data, textStatus, jqXHR){

                        if($('#mensaje').length === 0){
                            $('#form-login').after($('<div>').attr("id","mensaje"))
                            $('#mensaje').hide()
                        }else{
                            $('#mensaje').hide()
                        }
                        if(data.error === 0){
                            $('#mensaje').text('Has Iniciado sesion correctamente')
                        }else{
                            $('#mensaje').text(data.error_msj)
                        }
                        $('#mensaje').slideDown()
                    },
                    error: function () {
                        console.error("Error al realizar la petición AJAX");
                    }
                })
            })
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.14</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
    <style>
        #error-message {
          display: none;
          color: red;
        }
    </style>
</head>
<body>

    <label for="binary-input">Introduce un número binario:</label>
    <input type="text" id="binary-input" maxlength="8">

    <div id="error-message">Introduce sólo números binarios (0 ó 1).</div>

    <script>
        // Dado el siguiente HTML, diseña el código jQuery para que se analice cada tecla pulsada en el input. 
        // Si es un carácter válido para números binarios se insertará. Si no lo es, no se insertará, 
        // se mostrará un mensaje de error durante 1 segundo y luego se ocultará (usa el método .delay()).
        $(document).ready(function () {
            $('#binary-input').on('keydown',function(e){
                if(e.key === '1' || e.key === '0'){
                }else{
                    $('#error-message').slideDown().delay(1000).slideUp()
                    e.preventDefault()
                }
            })
        });
    </script>
</body>
</html>

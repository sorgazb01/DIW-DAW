<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.7</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
</head>
<body>
    <input type="radio" id="audi" name="brand" value="Audi">
    <label for="audi">Audi</label>
    
    <input type="radio" id="mercedes" name="brand" value="Mercedes">
    <label for="mercedes">Mercedes</label>

    <input type="radio" id="hyundai" name="brand" value="Hyundai">
    <label for="hyundai">Hyundai</label>

    <p id="message"></p>

    <script>
        // A partir del siguiente HTML en el que tenemos 3 
        // radiobuttons con opciones de marcas de coche, 
        // cuando el usuario modifique la opción seleccionada 
        // aparecerá un mensaje indicando la opción seleccionada.
        $(document).ready(function () {
            $('input[name="brand"]').on('change', function(){
                if($('#audi').is(':checked')){
                    $('#message').html('Has seleccionado Audi')
                }else if($('#mercedes').is(':checked')){
                    $('#message').html('Has seleccionado Mercedes')
                }else if($('#hyundai').is(':checked')){
                    $('#message').html('Has seleccionado Hyundai')
                }
            })
        });
    </script>
</body>
</html>

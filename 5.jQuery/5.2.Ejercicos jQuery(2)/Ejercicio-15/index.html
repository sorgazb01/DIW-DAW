<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.15</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
</head>
<body>
    <form id="car-brands-form">
        <p>Elige al menos una marca de coche:</p>
        <label><input type="checkbox" name="brand" value="Toyota"> Toyota</label><br>
        <label><input type="checkbox" name="brand" value="Ford"> Ford</label><br>
        <label><input type="checkbox" name="brand" value="Honda"> Honda</label><br>
        <label><input type="checkbox" name="brand" value="BMW"> BMW</label><br>
        <label><input type="checkbox" name="brand" value="Mercedes"> Mercedes</label><br><br>
        <button type="submit">Enviar</button>
    </form>
      
    <div id="error-message" style="color: red; display: none;">Selecciona al menos una marca de coche.</div>

    <script>
        // Dado el siguiente HTML, cuando el usuario quiera enviar el formulario se comprobará con jQuery 
        // si hay al menos un checkbox marcado. Si no hay ninguno, se mostrará un mensaje de error. 
        // Si hay al menos uno, es enviará el formulario.
        $(document).ready(function () {
            $('#car-brands-form').on('submit',function(e){
                let formularioVacio = true
                $.each($('input[name="brand"]'), function (indexInArray, valueOfElement) { 
                     if($(this).is(':checked')){
                        formularioVacio = false
                     }
                });

                if(formularioVacio){
                    e.preventDefault()
                    $('#error-message').slideDown().delay(1000).slideUp()
                }
            })
        });
    </script>
</body>
</html>

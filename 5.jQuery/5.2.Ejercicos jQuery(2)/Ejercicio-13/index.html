<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios jQuery 2.13</title>
    <link rel="stylesheet" href="../css/estilos_generales.css">
    <script src="../jquery-3.7.1.min.js"></script>
</head>
<body>
    <input type="button" value="Actualizar" id="refresh">
    <div id="respuesta"></div>

<script>
  $(document).ready(function () {
    $("#refresh").on("click", function () {
      $.ajax({
        url: "coches.json",
        type: "GET",
        success: function (data) {
          // Inserta aquí tu código
          $('#respuesta').append($('<ol>').attr('id','marcas'))
            for (let index = 0; index < data.length; index++) {
                const marca = data[index];
                $('#marcas').append($('<li>').attr('id',marca.marca))
                $('#'+marca.marca).text(marca.marca)
                $('#'+marca.marca).append($('<ol>').attr('id','coches'+marca.marca))
                for(let index = 0 ; index < marca.coches.length; index ++){
                    const coche = marca.coches[index]
                    $('#coches'+marca.marca).append($('<li>').text(coche.modelo+', '+coche.color+', '+coche.precio))
                } 
            }
        }
      });
    });
  });
</script>
</body>
</html>

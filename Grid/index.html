<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          box-sizing: border-box;
        }
    
        h2 {
          text-align: center;
          font-family: 'Consolas', 'Lucida Console', 'Courier New', Courier, monospace;
          padding: 10px;
          margin: 0px 0px 10px 0px;
        }
    
        /* Cuadro de opciones */
        #options {
          font-family: 'Consolas', 'Lucida Console', 'Courier New', Courier, monospace;
          display: inline-grid;
          grid-template-rows: repeat(4, auto);
          grid-template-columns: repeat(8, auto);
          gap: 10px;
        }
    
        #options .propiedad {
          padding: 5px 10px;
          font-weight: bold;
        }
    
        #options .valor {
          font-size: small;
          border-radius: 5px;
          cursor: pointer;
          padding: 5px 10px;
          background-color: #ccc;
        }
    
        #options .valor.active,
        #options .valor:hover {
          background-color: #333;
          color: white;
        }
    
        #options span.icono {
          color: white;
          padding: 5px;
          border-radius: 3px;
          font-family: 'Consolas', 'Lucida Console', 'Courier New', Courier, monospace;
          font-weight: bold;
          cursor: help;
        }
    
        #options span.horizontal {
          background-color: blue;
        }
    
        #options span.vertical {
          background-color: green;
        }
    
        /* Contenedor grid del ejemplo */
        #contenedor-grid {
          background-color: #ccc;
          width: 770px;
          margin: 20px 0px 20px 20px;
          height: 300px;
          display: grid;
          grid-template-columns: repeat(2, 250px);
          grid-template-rows: repeat(3, 75px);
          justify-items: start;
          align-items: center;
          justify-content: end;
          align-content: end;
        }
    
        #contenedor-grid .item {
          padding: 10px;
          color: white;
          font-weight: bold;
          display: flex;
          justify-content: center;
          align-items: center;
        }
    
        #contenedor-grid .item:nth-child(1) {
          background-color: darkred;
        }
    
        #contenedor-grid .item:nth-child(2) {
          background-color: darkgreen;
        }
    
        #contenedor-grid .item:nth-child(3) {
          background-color: darkblue;
        }
    
        #contenedor-grid .item:nth-child(4) {
          background-color: darkgoldenrod;
          align-self: stretch;
          justify-self: center;
        }
    
        #contenedor-grid .item:nth-child(5) {
          background-color: darkmagenta;
        }
    
        #contenedor-grid .item:nth-child(6) {
          background-color: darkslategray;
        }
    
        /* Explicación en lista de propiedades */
        .ul-propiedades>li {
          padding: 5px;
          margin: 0;
        }
    
        .ul-propiedades>li.highlight {
          background-color: rgb(172, 255, 172);
        }
    
        code {
          background-color: lightgrey;
          padding: 2px 5px;
          font-family: 'Consolas', 'Lucida Console', 'Courier New', Courier, monospace;
          font-size: medium;
        }
    
        p,
        li {
          line-height: 1.5;
        }
      </style>
</head>
<body>
    <div id="contenedor-grid">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
      </div>
</body>
</html>
